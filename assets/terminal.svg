</g>
<g class="b tb2">
<rect x="24" y="147" width="488.9" height="124" rx="4" fill="none" stroke="#4d565f"/>
<line x1="226.3" y1="147" x2="226.3" y2="271" stroke="#4d565f"/>
<line x1="24" y1="169" x2="512.9" y2="169" stroke="#4d565f"/>
<text x="36.6" y="162.0" fill="#79c0ff" textLength="42.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">layer</text>
<text x="239.0" y="162.0" fill="#79c0ff" textLength="75.9" lengthAdjust="spacingAndGlyphs" xml:space="preserve">currently</text>
