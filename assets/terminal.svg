<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 488" width="800" role="img" aria-label="Animated terminal: Arnav Borkar builds data platforms and AI systems">
<style>
text{font-family:'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:14px}
@keyframes show{to{opacity:1}}
@keyframes hide{to{opacity:0}}
@keyframes blinkk{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
.blink{animation:blinkk 1.1s step-end 13.25s infinite}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s !important;animation-delay:0s !important}.blink{animation:none !important}}
.c1{opacity:0;animation:show .01s linear 0.60s forwards}
.c1v{animation:sl1 0.40s steps(6,end) 0.75s forwards}
@keyframes sl1{to{transform:translateX(50.6px)}}
.c1u{animation:hide .01s linear 1.15s forwards}
.o5{opacity:0;animation:show .01s linear 1.50s forwards}
.c2{opacity:0;animation:show .01s linear 2.12s forwards}
.c2v{animation:sl2 3.94s steps(67,end) 2.27s forwards}
@keyframes sl2{to{transform:translateX(564.8px)}}
.c2u{animation:hide .01s linear 6.21s forwards}
.tb2{opacity:0;animation:show .01s linear 6.56s forwards}
.tr18{opacity:0;animation:show .01s linear 6.63s forwards}
.tr19{opacity:0;animation:show .01s linear 6.70s forwards}
.tr20{opacity:0;animation:show .01s linear 6.77s forwards}
.tr21{opacity:0;animation:show .01s linear 6.84s forwards}
.c3{opacity:0;animation:show .01s linear 7.46s forwards}
.c3v{animation:sl3 2.76s steps(47,end) 7.61s forwards}
@keyframes sl3{to{transform:translateX(396.2px)}}
.c3u{animation:hide .01s linear 10.38s forwards}
.o27{opacity:0;animation:show .01s linear 10.73s forwards}
.c4{opacity:0;animation:show .01s linear 11.35s forwards}
.c4v{animation:sl4 0.65s steps(11,end) 11.50s forwards}
@keyframes sl4{to{transform:translateX(92.7px)}}
.c4u{animation:hide .01s linear 12.14s forwards}
.o33{opacity:0;animation:show .01s linear 12.49s forwards}
.o34{opacity:0;animation:show .01s linear 12.56s forwards}
.o35{opacity:0;animation:show .01s linear 12.63s forwards}
.idle{opacity:0;animation:show .01s linear 13.25s forwards}</style>
<rect x="1" y="1" width="798" height="486" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<circle cx="26" cy="20" r="6" fill="#ff5f56"/>
<circle cx="48" cy="20" r="6" fill="#ffbd2e"/>
