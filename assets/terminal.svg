</g>
<rect x="1" y="1" width="798" height="486" rx="12" fill="none" stroke="#30363d" stroke-width="2"/>
<rect x="1" y="1" width="798" height="486" rx="12" fill="url(#scan)" pointer-events="none"/>
<defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
<rect width="4" height="2" fill="#ffffff" opacity="0.015"/>
<rect y="2" width="4" height="2" fill="#000000" opacity="0.05"/>
</pattern></defs>
</svg>
