<g class="b tr20"><text x="36.6" y="228.0" fill="#e6edf3" textLength="75.9" lengthAdjust="spacingAndGlyphs" xml:space="preserve">AI agents</text><text x="239.0" y="228.0" fill="#e6edf3" textLength="210.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">putting them to real work</text></g>
<g class="b tr21"><text x="36.6" y="250.0" fill="#e6edf3" textLength="160.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">distributed systems</text><text x="239.0" y="250.0" fill="#e6edf3" textLength="210.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Raft, Kafka, sane retries</text></g>
