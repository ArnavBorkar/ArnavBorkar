</g>
<g class="b o33"><text x="24.0" y="392.0" fill="#79c0ff" textLength="320.3" lengthAdjust="spacingAndGlyphs" xml:space="preserve">linkedin   linkedin.com/in/arnavborkar</text></g>
<g class="b o34"><text x="24.0" y="414.0" fill="#79c0ff" textLength="236.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">x          x.com/arnavborkar</text></g>
<g class="b o35"><text x="24.0" y="436.0" fill="#79c0ff" textLength="295.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">mail       arnav.n.borkar@gmail.com</text></g>
<g class="b idle">
<text x="24.0" y="480.0" fill="#7ee787" textLength="134.9" lengthAdjust="spacingAndGlyphs" xml:space="preserve">arnav@github ~ %</text>
