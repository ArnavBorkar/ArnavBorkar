</g>
<g class="b o5"><text x="24.0" y="96.0" fill="#e6edf3" textLength="438.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Arnav Borkar. I build data platforms and AI systems.</text></g>
<g class="b c2">
<text x="24.0" y="140.0" fill="#7ee787" textLength="134.9" lengthAdjust="spacingAndGlyphs" xml:space="preserve">arnav@github ~ %</text>
